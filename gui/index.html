<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ComfyUI Utils</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #667085; --line: #e1e5ec;
  --accent: #3b6ef5; --ok: #1a8f4c; --warn: #b7791f; --bad: #c0392b; --info: #0e7490;
  --chip: #eef1f6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171d; --panel: #1c2028; --text: #e6e9f0; --muted: #98a2b3; --line: #2b313c;
    --accent: #6d94ff; --ok: #4cc27e; --warn: #e0a64a; --bad: #ef6b5b; --info: #4cc3dc; --chip: #262b35;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, "Segoe UI", sans-serif; display: flex; flex-direction: column; overflow: hidden; }
header { flex: none; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { font-size: 15px; margin: 0 8px 0 0; }
main { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 12px 16px 8px; }
select, input[type=text], button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; }
button { cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button:disabled { opacity: .5; cursor: default; }
label { display: inline-flex; gap: 5px; align-items: center; color: var(--muted); }
.bar { height: 6px; background: var(--chip); border-radius: 3px; width: 220px; overflow: hidden; }
.bar > div { height: 100%; background: var(--accent); width: 0; transition: width .2s; }
.progress { display: none; align-items: center; gap: 8px; color: var(--muted); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 10px; }
#resultpanel { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.filters { flex: none; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; }
#resultpanel > .toolbar { flex: none; border-bottom: 1px solid var(--line); }
.chip { padding: 2px 9px; border-radius: 999px; background: var(--chip); border: 1px solid transparent; cursor: pointer; color: var(--muted); user-select: none; }
.chip.on { border-color: var(--accent); color: var(--text); }
.tablewrap { flex: 1; min-height: 0; overflow: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; white-space: nowrap; }
th { position: sticky; top: 0; z-index: 2; background: var(--panel); color: var(--muted); font-weight: 600; cursor: pointer; box-shadow: 0 1px 0 var(--line); }
tr:hover td { background: color-mix(in srgb, var(--accent) 5%, transparent); }
td.used { white-space: normal; max-width: 300px; }
td.issue { white-space: pre-wrap; width: 100%; min-width: 360px; overflow-wrap: anywhere; color: var(--bad); font-size: 12px; }
tr.flash td { background: color-mix(in srgb, var(--ok) 14%, transparent); }
tr.side td { background: color-mix(in srgb, var(--warn) 16%, transparent); }
.badge { padding: 1px 8px; border-radius: 999px; font-size: 12px; border: 1px solid currentColor; white-space: nowrap; }
.s-safe { color: var(--ok); } .s-safe-deps { color: var(--ok); border-style: dashed; } .s-ok { color: var(--muted); } .s-risky { color: var(--bad); } .s-unknown { color: var(--warn); }
.s-missing { color: var(--info); } .s-downgrade { color: var(--warn); } .s-held, .s-pinned { color: var(--accent); } .s-pin-mismatch { color: var(--bad); }
.mono { font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
.muted { color: var(--muted); }
.risk { color: var(--warn); }
.bad { color: var(--bad); }
pre { margin: 0; padding: 12px; overflow: auto; background: var(--bg); font-size: 12px; white-space: pre-wrap; }
#drawer { flex: none; background: var(--panel); border-top: 2px solid var(--accent); position: relative; }
#grip { position: absolute; left: 0; right: 0; top: -6px; height: 10px; cursor: ns-resize; z-index: 3; }
#drawer pre { height: var(--logh, 200px); }
#drawer.min pre { display: none; }
#drawer .toolbar { padding: 6px 12px; }
.l-add { color: var(--ok); } .l-del { color: var(--bad); } .l-err { color: var(--bad); font-weight: 600; } .l-warn { color: var(--warn); }
.l-cmd { color: var(--accent); } .l-dim { color: var(--muted); }
.l-head { display: block; color: var(--text); font-weight: 700; margin-top: 6px; padding-top: 4px; border-top: 1px dashed var(--line); }
.l-head:first-child { margin-top: 0; border-top: none; padding-top: 0; }
#extrapanel { flex: none; max-height: 26vh; overflow: auto; }
details { padding: 8px 12px; } summary { cursor: pointer; font-weight: 600; }
.link { background: none; border: none; color: var(--accent); padding: 0 4px; }
dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 0; width: min(860px, 94vw); max-height: 88vh; }
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog form { display: flex; flex-direction: column; max-height: 88vh; }
#dlgbody { padding: 12px 16px; overflow: auto; flex: 1; }
#dlghead, #dlgfoot { padding: 12px 16px; display: flex; gap: 10px; align-items: center; }
#dlghead { border-bottom: 1px solid var(--line); flex-wrap: wrap; }
#dlgfoot { border-top: 1px solid var(--line); justify-content: flex-end; }
.chg { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 2px 0; }
.chg .mono { overflow-wrap: anywhere; }
h3 { margin: 12px 0 4px; font-size: 13px; }
@media (max-width: 700px) { main { padding: 8px; } header { padding: 8px; } }
</style>
</head>
<body>
<header>
  <h1>ComfyUI Utils · pip audit</h1>
  <label>venv <select id="venv"></select></label>
  <label title="Also scan requirements of the nodes in custom_nodes_repo_path (real clones, including ones not linked into custom_nodes)"><input type="checkbox" id="repo"> include custom_nodes_repo</label>
  <label><input type="checkbox" id="pip"> use pip instead of uv</label>
  <button class="primary" id="run">Run audit</button>
  <div class="progress" id="progress"><span id="plabel"></span><div class="bar"><div id="pbar"></div></div></div>
  <span class="muted" id="info"></span>
</header>
<main>
  <div class="panel" id="resultpanel" hidden>
    <div class="filters">
      <input type="text" id="search" placeholder="Filter packages…" size="22">
      <label><input type="checkbox" id="hide" checked> hide unchanged</label>
      <select id="node"><option value="">all nodes</option></select>
      <span id="chips"></span>
      <span class="muted" id="count"></span>
    </div>
    <div class="toolbar">
      <button id="selsafe" title="Only the package itself changes">Select safe</button>
      <button id="selsafed" title="Safe, but other packages change too (see the badge tooltip); no requirement is broken">Select safe +deps</button>
      <button id="selvis">Select visible</button>
      <button id="selnone">Clear</button>
      <button class="primary" id="install">Install selected…</button>
      <span class="muted" id="selinfo"></span>
    </div>
    <div class="tablewrap"><table>
      <thead><tr><th></th><th data-k="name">Package</th><th data-k="installed">Installed</th><th data-k="install">Will install</th><th data-k="target" title="Highest version the requirements allow">Latest allowed</th><th data-k="state">State</th><th>Used in</th><th>Issue</th><th>Rule</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </div>
  <div class="panel" id="extrapanel" hidden>
    <details id="vcsd"><summary>VCS / URL requirements</summary><div id="vcs"></div></details>
    <details id="envd"><summary>comfy-env isolation</summary><div id="env"></div></details>
  </div>
</main>
<div id="drawer">
  <div id="grip" title="Drag to resize"></div>
  <div class="toolbar"><b>Log</b><span class="badge" id="logstatus"></span><span id="logtitle" class="muted"></span><span class="muted" id="logsummary"></span>
    <span style="flex:1"></span><button id="logcopy">copy</button><button id="logclear">clear</button><button id="logmin">minimize</button></div>
  <pre id="log"></pre>
</div>
<dialog id="dlg">
  <form method="dialog" onsubmit="return false">
    <div id="dlghead">
      <b>Install preview</b>
      <label title="Other packages stay exactly as they are; the install fails if a dependency would have to change"><input type="radio" name="protect" value="all"> keep all other packages</label>
      <label title="Packages on this venv's hold list and pins stay as they are"><input type="radio" name="protect" value="held" checked> keep held / pinned</label>
      <label><input type="radio" name="protect" value="none"> no protection</label>
    </div>
    <div id="dlgbody"></div>
    <div id="dlgfoot"><span class="muted" id="dlgnote" style="flex:1"></span><button type="button" id="dlgcancel">Cancel</button><button type="button" class="primary" id="dlgok" disabled>Install</button></div>
  </form>
</dialog>
<script>
const TOKEN = "__TOKEN__";
const $ = id => document.getElementById(id);
// order = what needs installing first, what needs nothing last
const STATES = ["missing", "safe", "safe-deps", "pin-mismatch", "downgrade", "risky", "unknown", "held", "pinned", "ok"];
const RANK = Object.fromEntries(STATES.map((s, i) => [s, i]));
const LABEL = {"safe-deps": "safe +deps"};
const sideTip = r => (r.side_changes || []).map(c => `${c.name} ${c.from || "-"} -> ${c.to || "-"}`).join("\n");
let data = null, rules = {hold: new Set(), pins: {}}, selected = new Set(), activeStates = new Set(STATES);
let sortKey = "state", sortDir = 1, pending = null, previewSeq = 0;

// what "Install selected" will put into the venv for a row
function plan(r) {
  if (r.safe_update) return {ver: r.safe_update, risky: false};
  if (r.state === "missing" || r.state === "downgrade") return {ver: r.target, risky: false};
  if (r.risky_update) return {ver: r.risky_update, risky: true};
  return {ver: "", risky: false};
}

async function api(path, body) {
  const opt = body === undefined ? {} : {method: "POST", headers: {"X-Token": TOKEN, "Content-Type": "application/json"}, body: JSON.stringify(body)};
  const r = await fetch(path, opt);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const verParts = v => String(v).split(/[^0-9]+/).filter(Boolean).map(Number);
function cmpVer(a, b) { const x = verParts(a), y = verParts(b); for (let i = 0; i < Math.max(x.length, y.length); i++) { const d = (x[i] || 0) - (y[i] || 0); if (d) return d; } return 0; }

async function init() {
  const st = await api("/api/state");
  $("venv").innerHTML = st.venvs.filter(v => v.exists === "1").map(v => `<option value="${esc(v.name)}" ${v.selected === "1" ? "selected" : ""}>${esc(v.name)}${v.comment ? " — " + esc(v.comment) : ""}</option>`).join("");
  $("info").textContent = st.uv ? "uv found" : "uv not found, pip will be used";
  try { const s = JSON.parse(localStorage.getItem("audit-ui") || "{}"); if (s.venv && [...$("venv").options].some(o => o.value === s.venv)) $("venv").value = s.venv; $("repo").checked = !!s.repo; $("pip").checked = !!s.pip; } catch (e) {}
}

function watch(jobId, onDone, sink) {
  let since = 0;
  const tick = async () => {
    const j = await api(`/api/job/${jobId}?since=${since}`);
    since = j.next;
    if (sink && j.log.length) sink(j.log);
    if (j.progress) { $("progress").style.display = "flex"; $("plabel").textContent = `${j.progress.label} ${j.progress.i}/${j.progress.n}`; $("pbar").style.width = (j.progress.n ? 100 * j.progress.i / j.progress.n : 0) + "%"; }
    if (j.status === "running") return setTimeout(tick, 500);
    $("progress").style.display = "none";
    onDone(j);
  };
  tick();
}

$("run").onclick = async () => {
  const venv = $("venv").value;
  localStorage.setItem("audit-ui", JSON.stringify({venv, repo: $("repo").checked, pip: $("pip").checked}));
  $("run").disabled = true; selected.clear();
  showLog(`Audit: ${venv}`, "", "running");
  try {
    const {job} = await api("/api/audit", {venv, include_repo: $("repo").checked, force_pip: $("pip").checked});
    watch(job, j => {
      $("run").disabled = false;
      if (j.status === "error") { logAdd(["Audit failed: " + j.error]); setStatus("failed"); return; }
      data = j.result; rules.hold = new Set(data.hold); rules.pins = {...data.pins};
      buildFilters(); render();
      $("resultpanel").hidden = false;
      renderExtra();
      const todo = data.rows.filter(r => !isUnchanged(r)).length;
      logAdd([`Audit done: ${data.rows.length} packages, ${todo} need attention, ${data.vcs.length} VCS/URL entries.`]);
      setStatus("done");
    }, logAdd);
  } catch (e) { $("run").disabled = false; logAdd(["Audit failed: " + e.message]); setStatus("failed"); }
};

const LOGRULES = [
  [/^exit code [1-9]|error|×|failed|unsatisfiable|cannot be|conflict/i, "l-err"],
  [/^updated as requested|^exit code 0|^audit done|^saved:/i, "l-add"],
  [/warning|downgrade|side effect|risky|re-run the audit/i, "l-warn"],
  [/^\s*\+ /, "l-add"], [/^\s*- /, "l-del"],
  [/^> /, "l-cmd"],
  [/^(Resolved|Prepared|Installed|Uninstalled|Using|Audited|Checked|Downloaded)/, "l-dim"],
];
function logAdd(lines) {
  const el = $("log"), stick = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
  lines.flatMap(l => String(l).split("\n")).forEach(l => {
    const cls = (LOGRULES.find(([re]) => re.test(l)) || [])[1];
    const sp = document.createElement("div");
    sp.textContent = l || " "; if (cls) sp.className = cls;
    el.appendChild(sp);
  });
  if (stick) el.scrollTop = el.scrollHeight;
}
function logHead(title) {
  const h = document.createElement("div"); h.className = "l-head"; h.textContent = `${new Date().toLocaleTimeString()}  ${title}`;
  $("log").appendChild(h); $("log").scrollTop = $("log").scrollHeight;
}
function showLog(title, text, status) {
  if ($("drawer").classList.contains("min")) $("logmin").onclick();
  logHead(title); $("logtitle").textContent = title; $("logsummary").textContent = "";
  if (text) logAdd([text]);
  setStatus(status || "running");
}
function setStatus(st) {
  const b = $("logstatus"); b.textContent = st;
  b.className = "badge " + (st === "done" ? "s-safe" : st === "running" ? "s-unknown" : st === "idle" ? "s-ok" : "s-risky");
}
setStatus("idle");
$("logmin").onclick = () => { const m = $("drawer").classList.toggle("min"); $("logmin").textContent = m ? "expand" : "minimize"; };
$("logclear").onclick = () => { $("log").textContent = ""; $("logtitle").textContent = ""; $("logsummary").textContent = ""; setStatus("idle"); };
$("logcopy").onclick = () => navigator.clipboard.writeText($("log").innerText).catch(() => {});
// drag the top edge to change the log height; remembered between sessions
(() => {
  const set = h => document.documentElement.style.setProperty("--logh", Math.max(60, Math.min(h, window.innerHeight * 0.8)) + "px");
  try { const h = parseInt(localStorage.getItem("log-h")); if (h) set(h); } catch (e) {}
  $("grip").onpointerdown = e => {
    e.preventDefault(); $("grip").setPointerCapture(e.pointerId);
    const startY = e.clientY, startH = $("log").getBoundingClientRect().height;
    $("grip").onpointermove = ev => set(startH + startY - ev.clientY);
    $("grip").onpointerup = ev => {
      $("grip").onpointermove = null; $("grip").onpointerup = null;
      try { localStorage.setItem("log-h", String(Math.round($("log").getBoundingClientRect().height))); } catch (e) {}
    };
  };
})();

function buildFilters() {
  const nodes = [...new Set(data.rows.flatMap(r => r.used_in.map(u => u.repo)))].sort((a, b) => a.localeCompare(b));
  $("node").innerHTML = '<option value="">all nodes</option>' + nodes.map(n => `<option>${esc(n)}</option>`).join("");
  const counts = {}; data.rows.forEach(r => counts[r.state] = (counts[r.state] || 0) + 1);
  $("chips").innerHTML = STATES.filter(s => counts[s]).map(s => `<span class="chip ${activeStates.has(s) ? "on" : ""}" data-s="${s}">${LABEL[s] || s} ${counts[s]}</span>`).join(" ");
  $("chips").querySelectorAll(".chip").forEach(c => c.onclick = () => { const s = c.dataset.s; activeStates.has(s) ? activeStates.delete(s) : activeStates.add(s); c.classList.toggle("on"); render(); });
}

function isUnchanged(r) { return r.unchanged ?? (r.state === "ok" && !r.issue); }

function visibleRows() {
  const q = $("search").value.trim().toLowerCase(), node = $("node").value, hide = $("hide").checked;
  const rows = data.rows.filter(r => activeStates.has(r.state)
    && !(hide && isUnchanged(r) && !r.flash && !r.side)
    && (!q || r.name.includes(q))
    && (!node || r.used_in.some(u => u.repo === node)));
  const key = r => sortKey === "state" ? RANK[r.state] : sortKey === "install" ? plan(r).ver : r[sortKey];
  rows.sort((a, b) => (key(a) > key(b) ? 1 : key(a) < key(b) ? -1 : 0) * sortDir || a.name.localeCompare(b.name));
  return rows;
}

function render() {
  if (!data) return;
  const rows = visibleRows();
  $("count").textContent = `${rows.length} of ${data.rows.length}`;
  $("rows").innerHTML = rows.map(r => {
    const held = rules.hold.has(r.name), pin = rules.pins[r.name];
    const used = r.used_in.map(u => `<span title="${esc(u.spec || "no specifier")}">${esc(u.repo)}</span>`).join(", ");
    const p = plan(r);
    const inst = p.ver ? (p.risky ? `<span class="risk" title="No safe version found; this one conflicts with something">${esc(p.ver)} (risky)</span>` : esc(p.ver)) : "—";
    const was = r.was ? ` <span class="${r.side ? "risk" : "muted"}" title="${r.side ? "changed as a side effect of an install" : "updated"}">(was ${esc(r.was)})</span>` : "";
    return `<tr class="${r.flash ? "flash" : r.side ? "side" : ""}"><td><input type="checkbox" data-n="${esc(r.name)}" ${selected.has(r.name) ? "checked" : ""}></td>
      <td class="mono">${esc(r.name)}</td><td class="mono">${esc(r.installed) || "—"}${was}</td><td class="mono">${inst}</td><td class="mono muted">${esc(r.target) || "—"}</td>
      <td><span class="badge s-${r.state}" title="${esc(sideTip(r))}">${LABEL[r.state] || r.state}</span></td><td class="used">${used}</td><td class="issue">${esc(r.issue)}</td>
      <td>${held ? `<button class="link" data-a="unhold" data-n="${esc(r.name)}">unhold</button>` : `<button class="link" data-a="hold" data-n="${esc(r.name)}">hold</button>`}
          ${pin ? `<button class="link" data-a="unpin" data-n="${esc(r.name)}">unpin ${esc(pin)}</button>` : r.installed ? `<button class="link" data-a="pin" data-n="${esc(r.name)}">pin ${esc(r.installed)}</button>` : ""}</td></tr>`;
  }).join("");
  $("rows").querySelectorAll("input[type=checkbox]").forEach(cb => cb.onchange = () => { cb.checked ? selected.add(cb.dataset.n) : selected.delete(cb.dataset.n); updateSel(); });
  $("rows").querySelectorAll("button[data-a]").forEach(b => b.onclick = () => rule(b.dataset.a, b.dataset.n));
  updateSel();
}

function updateSel() { $("selinfo").textContent = selected.size ? `${selected.size} selected` : ""; $("install").disabled = !selected.size || $("install").dataset.busy === "1"; }

async function rule(action, name) {
  const row = data.rows.find(r => r.name === name);
  if (action === "hold") rules.hold.add(name);
  if (action === "unhold") rules.hold.delete(name);
  if (action === "pin") rules.pins[name] = row.installed;
  if (action === "unpin") delete rules.pins[name];
  await api("/api/rules", {venv: data.venv, hold: [...rules.hold], pins: rules.pins});
  if (!row) return;  // a dependency that no requirements.txt lists has no table row
  row.state = rules.pins[name] ? (rules.pins[name] === row.installed ? "pinned" : "pin-mismatch") : rules.hold.has(name) ? "held" : (row.action ? "upgrade" : "ok");
  row.unchanged = !(row.action || row.issue) && row.state !== "pin-mismatch";
  render();
}

function renderExtra() {
  const vcs = data.vcs.map(v => `<div class="mono">${esc(v.name || "?")} <span class="muted">${esc(v.repo)}</span> ${esc(v.raw)} — ${v.installed ? "installed " + esc(v.installed) : "missing"}${v.need_install ? " (will install)" : ""}</div>`).join("");
  $("vcs").innerHTML = vcs || '<span class="muted">none</span>';
  const env = data.comfy_env.map(e => `<div><b>${esc(e.repo)}</b> ${e.isolations.map(i => `<span class="badge ${i.built ? (i.stale ? "s-unknown" : "s-safe") : "s-risky"}">${esc(i.env)}: ${i.built ? (i.stale ? "stale" : "ok") : "missing"}</span>`).join(" ")}</div>`).join("");
  $("env").innerHTML = env || '<span class="muted">none</span>';
  $("extrapanel").hidden = false;
}

// ---- install: preview (dry run) -> confirm -> real install
const protectMode = () => document.querySelector("input[name=protect]:checked").value;

$("install").onclick = () => {
  const items = [...selected].map(n => { const r = data.rows.find(x => x.name === n); return {name: n, ver: plan(r).ver, state: r.state}; }).filter(i => i.ver);
  if (!items.length) return alert("Nothing to install for the selected rows.");
  pending = {items, pkgs: items.map(i => `${i.name}==${i.ver}`)};
  $("dlg").showModal();
  preview();
};
$("dlgcancel").onclick = () => $("dlg").close();
document.querySelectorAll("input[name=protect]").forEach(r => r.onchange = () => pending && preview());

async function preview() {
  const seq = ++previewSeq;
  $("dlgok").disabled = true; $("dlgnote").textContent = "";
  $("dlgbody").innerHTML = '<span class="muted">Checking what would change…</span>';
  const buf = [];
  try {
    const {job} = await api("/api/install", {venv: data.venv, packages: pending.pkgs, force_pip: $("pip").checked, protect: protectMode(), dry_run: true});
    watch(job, j => { if (seq === previewSeq) showPreview(j, buf); }, lines => buf.push(...lines));
  } catch (e) { $("dlgbody").innerHTML = `<span class="bad">${esc(e.message)}</span>`; }
}

function chgRow(c, extra) {
  const down = c.from && c.to && cmpVer(c.to, c.from) < 0;
  const what = !c.from ? "added" : !c.to ? "removed" : down ? "DOWNGRADE" : "";
  const hold = extra && c.from && !rules.hold.has(c.name) ? ` <button type="button" class="link" data-hold="${esc(c.name)}" title="Add to the hold list and check again">hold</button>` : "";
  return `<div class="chg"><span class="mono">${esc(c.name)}${hold}</span><span class="mono ${down ? "bad" : extra ? "risk" : ""}">${esc(c.from || "—")} → ${esc(c.to || "—")} ${what ? `<b>${what}</b>` : ""}</span></div>`;
}

function showPreview(j, buf) {
  if (j.status === "error" || j.result.exit_code !== 0) {
    $("dlgbody").innerHTML = '<div class="bad"><b>This cannot be installed with the chosen protection.</b> Pick a weaker option, or hold/pin differently.</div>';
    const pre = document.createElement("pre"); pre.textContent = (j.error ? j.error + "\n" : "") + buf.slice(-14).join("\n");
    $("dlgbody").appendChild(pre); $("dlgok").disabled = true; return;
  }
  const want = new Set(pending.items.map(i => i.name));
  const main = j.result.changes.filter(c => want.has(c.name)), extra = j.result.changes.filter(c => !want.has(c.name));
  $("dlgbody").innerHTML = `<h3>Selected (${main.length})</h3>${main.map(c => chgRow(c, false)).join("") || '<span class="muted">already installed</span>'}`
    + `<h3 class="${extra.length ? "risk" : ""}">Also changed by dependencies (${extra.length})</h3>`
    + (extra.map(c => chgRow(c, true)).join("") || '<span class="muted">nothing else changes</span>');
  $("dlgbody").querySelectorAll("button[data-hold]").forEach(b => b.onclick = async () => { await rule("hold", b.dataset.hold); preview(); });
  $("dlgnote").textContent = `${j.result.changes.length} package(s) will change`;
  $("dlgok").disabled = !j.result.changes.length;
}

$("dlgok").onclick = () => { $("dlg").close(); doInstall(protectMode()); };

async function doInstall(protect) {
  const {items, pkgs} = pending;
  showLog(`Installing ${pkgs.length} package(s) into ${data.venv}`, "", "running");
  $("install").dataset.busy = "1"; $("install").disabled = true; $("install").textContent = "Installing…";
  const finish = () => { $("install").dataset.busy = "0"; $("install").textContent = "Install selected…"; updateSel(); };
  try {
    const {job} = await api("/api/install", {venv: data.venv, packages: pkgs, force_pip: $("pip").checked, protect, dry_run: false});
    watch(job, j => {
      finish();
      if (j.status === "error" || j.result.exit_code !== 0) {
        setStatus("failed"); if (j.error) logAdd([j.error]);
        $("logsummary").textContent = "the table was not changed, check the output"; return;
      }
      const want = Object.fromEntries(items.map(i => [i.name, i.ver]));
      data.rows.forEach(r => { delete r.flash; delete r.side; });
      const done = [], side = [], other = [];
      j.result.changes.forEach(c => {
        const row = data.rows.find(x => x.name === c.name);
        if (!row) { other.push(c); return; }
        row.was = c.from; row.installed = c.to;
        if (want[c.name] && c.to === want[c.name]) {
          row.action = ""; row.safe_update = ""; row.risky_update = ""; row.issue = ""; row.unchanged = true; row.flash = true;
          row.state = rules.pins[c.name] ? "pinned" : rules.hold.has(c.name) ? "held" : "ok";
          selected.delete(c.name); done.push(c);
        } else { row.side = true; side.push(c); }
      });
      const fmt = c => `${c.name} ${c.from || "-"} -> ${c.to || "-"}`;
      setStatus("done");
      logAdd([`\nUpdated as requested: ${done.length}` + (done.length ? "\n  " + done.map(fmt).join("\n  ") : "")
        + (side.length ? `\nChanged as a side effect (in the table, highlighted): ${side.length}\n  ` + side.map(fmt).join("\n  ") : "")
        + (other.length ? `\nChanged, not in the table: ${other.length}\n  ` + other.map(fmt).join("\n  ") : "")
        + (side.length + other.length ? "\nRe-run the audit to re-check the packages that changed as side effects." : "")]);
      $("logsummary").textContent = `${done.length} updated` + (side.length + other.length ? `, ${side.length + other.length} changed by dependencies` : "");
      buildFilters(); render();
    }, logAdd);
  } catch (e) { finish(); setStatus("failed"); logAdd([e.message]); }
}

$("selsafe").onclick = () => { data.rows.filter(r => r.state === "safe").forEach(r => selected.add(r.name)); render(); };
$("selsafed").onclick = () => { data.rows.filter(r => r.state === "safe-deps").forEach(r => selected.add(r.name)); render(); };
$("selvis").onclick = () => { visibleRows().forEach(r => selected.add(r.name)); render(); };
$("selnone").onclick = () => { selected.clear(); render(); };
["search", "hide", "node"].forEach(id => $(id).oninput = render);
document.querySelectorAll("th[data-k]").forEach(th => th.onclick = () => { sortDir = sortKey === th.dataset.k ? -sortDir : 1; sortKey = th.dataset.k; render(); });
init().catch(e => alert(e.message));
</script>
</body>
</html>
