<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ComfyUI Utils social preview</title>
<style>
  /* Source of social_preview.png (GitHub: Settings > General > Social preview, 1280x640). Open in Chrome at 1280x640 and take a screenshot. */
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body {
    font: 16px/1.4 system-ui, "Segoe UI", sans-serif; color: #e6e9f0; position: relative;
    background:
      radial-gradient(900px 360px at 88% 0%, rgba(109,148,255,.30), transparent 70%),
      radial-gradient(700px 320px at 0% 55%, rgba(76,194,126,.16), transparent 70%),
      linear-gradient(135deg, #12151b, #1b2230);
  }
  body::before { content: ""; position: absolute; inset: 0; opacity: .45;
    background-image: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
    background-size: 32px 32px; }
  .top { position: absolute; left: 60px; top: 38px; right: 60px; }
  h1 { margin: 0; font-size: 70px; letter-spacing: -1.5px; font-weight: 800; line-height: 1.05; }
  h1 span { background: linear-gradient(90deg, #6d94ff, #4cc3dc 60%, #4cc27e); -webkit-background-clip: text; color: transparent; }
  .tag { margin: 8px 0 0; font-size: 23px; color: #aab4c8; }
  .tag b { color: #e6e9f0; font-weight: 600; }
  .icons { position: absolute; left: 60px; top: 200px; display: flex; gap: 12px; }
  .card { width: 108px; padding: 10px 4px 8px; text-align: center; border-radius: 13px; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.05); box-shadow: 0 8px 22px rgba(0,0,0,.35); }
  .card img { width: 46px; height: 46px; display: block; margin: 0 auto 6px; }
  .card span { font-size: 12.5px; color: #c7cfdf; }
  .badges { position: absolute; right: 60px; top: 50px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
  .b { padding: 2px 14px; border-radius: 999px; border: 1.5px solid currentColor; font-size: 15px; background: rgba(18,21,27,.75); }
  .ok { color: #4cc27e; } .dep { color: #4cc27e; border-style: dashed; } .risk { color: #ef6b5b; } .wheel { color: #98a2b3; border-style: dashed; } .info { color: #4cc3dc; }
  .shot { position: absolute; left: 60px; right: 60px; top: 330px; height: 330px; overflow: hidden; border-radius: 14px 14px 0 0; border: 1px solid rgba(255,255,255,.14);
    box-shadow: 0 -10px 50px rgba(109,148,255,.25); }
  .shot img { width: 100%; display: block; margin-top: -92px; }
  .shot::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 55%, rgba(18,21,27,.95)); }
</style>
</head>
<body>
  <div class="top">
    <h1><span>ComfyUI</span> Utils</h1>
    <div class="tag"><b>venvs</b> · <b>pip packages</b> · <b>repos</b> · <b>workflows</b> · <b>custom nodes</b> — one local control panel</div>
  </div>
  <div class="icons">
    <div class="card"><img src="../ico/build_venv_run.ico" alt=""><span>Build venv</span></div>
    <div class="card"><img src="../ico/update_comfy_repos_run.ico" alt=""><span>Repos</span></div>
    <div class="card"><img src="../ico/comfyui_pip_update_audit_run.ico" alt=""><span>Pip audit</span></div>
    <div class="card"><img src="../ico/custom_nodes_link_manager_run.ico" alt=""><span>Nodes</span></div>
    <div class="card"><img src="../ico/update_workflow_repos_run.ico" alt=""><span>Workflows</span></div>
    <div class="card"><img src="../ico/compare_venv_versions_run.ico" alt=""><span>Compare venvs</span></div>
  </div>
  <div class="badges"><span class="b ok">safe</span><span class="b dep">safe +deps</span><span class="b risk">risky</span><span class="b wheel">from wheel</span><span class="b info">behind ↓3</span></div>
  <div class="shot"><img src="screenshot_audit.png" alt=""></div>
</body>
</html>
